# NAS 部署示例。
# 假设 NAS 上已经有 Mosquitto（群晖 Container Manager / 威联通 / TrueNAS 均可）。
# 如果 broker 也在这个 compose 里，把 mosquitto 服务的注释放开即可。

services:
  mosquitto:                      # 可选：自带 broker
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    # 多网段/公网暴露时务必启用密码与 TLS，见 README 的安全一节

  wq-nas:
    build: .
    image: wq-nas:1.0.0
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      WQ_MQTT_HOST: mosquitto
      WQ_MQTT_PORT: "1883"
      WQ_BASE: pool/01
      # 1800 = 训练口径（12 h 窗口，首报更早、瞬态不误报）
      #  120 = 固件口径（48 min 窗口，和 App 本机算的结果可比）
      WQ_STEP_S: "1800"
      WQ_VOTE_N: "3"
      WQ_MIN_CONF: "0.6"
      WQ_HEARTBEAT_S: "30"
      WQ_DB: /data/wq_nas.sqlite
      # WQ_MQTT_USER: aquarium
      # WQ_MQTT_PASS: ${MQTT_PASS}
    volumes:
      - wq-data:/data
    # NAS 上没必要给太多：实测常驻内存 ~60 MB，CPU 每小时跑 1~30 次推理
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  wq-data:
  mosquitto-data:
